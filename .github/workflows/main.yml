name: Thunder Next 2.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'timelm'
        type: choice
        options:
          - timelm
          - nethunter
          - evox
          - infinityx

      script:
        description: 'Select Build Script'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh

      ksu:
        description: 'Enable KernelSU (ReSukiSU-SuSFS)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Thunder Next 2.0 | ${{ inputs.device }} (${{ inputs.script }}) (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev libelf-dev lz4 ccache python-is-python3

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-
          kernel-ccache-${{ inputs.device }}-
          kernel-ccache-

    - name: Download and Setup ZyC Clang 16
      run: |
        set -euo pipefail

        mkdir -p "$HOME/toolchain"
        cd "$HOME/toolchain"

        URL="https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz"

        wget -q --show-progress "$URL" -O clang.tar.gz
        tar -xzf clang.tar.gz
        rm -f clang.tar.gz

        CLANG_BIN="$(find "$HOME/toolchain" -type f -name clang -perm /111 -print -quit)"

        if [ -z "$CLANG_BIN" ]; then
          echo "::error::Clang executable not found in downloaded archive"
          find "$HOME/toolchain" -maxdepth 3 -type f | head -100
          exit 1
        fi

        CLANG_DIR="$(dirname "$CLANG_BIN")"
        echo "$CLANG_DIR" >> "$GITHUB_PATH"
        echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
        echo "CLANG_PATH=$(dirname "$CLANG_DIR")" >> "$GITHUB_ENV"

        "$CLANG_BIN" --version

    - name: Build Kernel
      run: |
        chmod +x ${{ inputs.script }}

        echo "Using script: ${{ inputs.script }}"
        echo "Clang: $CLANG_BIN"

        if [ "${{ inputs.ksu }}" == "true" ]; then
          echo "Building with KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }} ksu
        else
          echo "Building without KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Thunder-Next-2.0-${{ inputs.device }}-${{ inputs.ksu && 'KSU' || 'NoKSU' }}-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error
        
