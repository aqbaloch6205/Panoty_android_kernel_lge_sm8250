name: Build Kernel (ZyC-Clang + ReSukiSU + KPM)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'panoty'
        type: choice
        options:
          - panoty
          - nethunter
          - evox
          - infinityx
          
      script:
        description: 'Select Build Script'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh

      ksu:
        description: 'Enable KernelSU (ReSukiSU-SuSFS-KPM)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    - name: Set Short Commit SHA
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-${{ inputs.ksu }}-${{ env.SHORT_SHA }}
        restore-keys: |
          kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-${{ inputs.ksu }}-
          kernel-ccache-${{ inputs.device }}-
          kernel-ccache-

    - name: Download and Setup ZyC-Clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz
        rm -f Clang-16.0.6-20260510.tar.gz
        echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

    - name: Build Kernel
      run: |
        chmod +x ${{ inputs.script }}
        
        echo "Executing script: ${{ inputs.script }} for device: ${{ inputs.device }}"

        if [ "${{ inputs.ksu }}" == "true" ]; then
          echo "Building with ReSukiSU + SuSFS + KPM..."
          bash ${{ inputs.script }} ${{ inputs.device }} ksu
        else
          echo "Building standard kernel without KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }}
        fi

    - name: Show ccache stats
      run: ccache -s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Kernel-${{ inputs.device }}-${{ inputs.ksu && 'ReSukiSU-KPM' || 'NoKSU' }}-${{ github.run_number }}
        path: |
          *.zip
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtb*
        if-no-files-found: error
